spring:
  application:
    name: notification-service
  profiles:
    active: local,swagger,loki
  # Config Server
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:6969
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: false
      retry:
        max-attempts: 10
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

server:
  port: 8004
