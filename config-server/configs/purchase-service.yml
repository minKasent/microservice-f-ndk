spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8001

# Purchase Configuration
purchase:
  platform-fee-rate: 0.30      # 30% platform fee
  creator-commission-rate: 0.70 # 70% creator commission
