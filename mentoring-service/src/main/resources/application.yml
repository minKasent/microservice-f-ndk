spring:
  application:
    name: mentoring-service
  profiles:
    active: local
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:6969
      fail-fast: false

server:
  port: 8007

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
