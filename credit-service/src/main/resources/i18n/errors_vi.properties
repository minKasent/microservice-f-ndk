# Credit Service Error Messages - Vietnamese
WALLET_NOT_FOUND=Không tìm thấy ví cho người dùng ID: {0}
INSUFFICIENT_BALANCE=Số dư trong ví không đủ
INVALID_AMOUNT=Số tiền không hợp lệ, phải là số dương
WITHDRAWAL_REQUEST_NOT_FOUND=Không tìm thấy yêu cầu rút tiền với ID: {0}
WITHDRAWAL_ALREADY_PROCESSED=Yêu cầu rút tiền đã được xử lý
MINIMUM_WITHDRAWAL_NOT_MET=Số tiền rút tối thiểu là {0} credits
PENDING_WITHDRAWAL_EXISTS=Bạn đã có một yêu cầu rút tiền đang chờ xử lý
