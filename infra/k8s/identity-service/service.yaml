# =============================================================================
# Service: identity-service — Type: NodePort
# =============================================================================
# Identity Service được expose ra ngoài bằng NodePort vì:
#   - Cần truy cập Swagger UI / OAuth2 authorize từ browser trong quá trình phát triển
#   - OAuth2 flows cần redirect URI có thể resolve từ bên ngoài cluster
#
# Truy cập từ bên ngoài:
#   http://localhost:30001  (qua k3d với port mapping 30001:30001@loadbalancer)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: devsharing
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: devsharing
spec:
  type: NodePort

  selector:
    app: identity-service

  ports:
    - name: http
      port: 8080           # Port của Service trong cluster
      targetPort: 8080     # Port của container (SERVER_PORT=8080)
      nodePort: 30001      # Port mở trên Node để truy cập từ ngoài cluster
      protocol: TCP
    - name: legacy
      port: 8001           # Legacy internal port mapping
      targetPort: 8080
      protocol: TCP
