# =============================================================================
# ConfigMap: purchase-service
# =============================================================================
# Purchase Service xử lý các giao dịch mua bán trong devsharing:
#   - Mua khóa học bằng credits hoặc tiền thật
#   - Quản lý lịch sử giao dịch
#   - Tích hợp với Credit Service để trừ/cộng điểm
#
# Service này giao tiếp với nhiều service khác (content, credit, identity)
# thông qua Feign client và Eureka discovery.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: purchase-service-config
  namespace: devsharing
  labels:
    app.kubernetes.io/name: purchase-service
    app.kubernetes.io/part-of: devsharing
data:
  # Tên service này trong hệ thống OTEL tracing
  OTEL_SERVICE_NAME: "purchase-service"

  # Port nội bộ của container
  SERVER_PORT: "8080"

  # Spring profile đang active
  SPRING_PROFILES_ACTIVE: "swagger"

  # Bật/tắt bảo mật trên Swagger UI (OAuth2 integration)
  API_DOCS_SECURITY_ENABLED: "false"

  # Path suffix cho API Docs
  # Sẽ được compose với BASE_GATEWAY_URL từ base-urls-config
  API_DOCS_PATH: "/purchase"

  # OAuth2 endpoint paths
  # Sẽ được compose với BASE_IDENTITY_URL từ base-urls-config
  OAUTH2_AUTHORIZE_PATH: "/oauth2/authorize"
  OAUTH2_TOKEN_PATH: "/oauth2/token"

  # URL JDBC kết nối MySQL (chạy trên host machine qua Docker bridge 172.23.0.1)
  DB_URL: "jdbc:mysql://172.23.0.1:3306/purchase_service?createDatabaseIfNotExist=true"
  DB_USER: "root"
  DB_PASSWORD: "root"
