# =============================================================================
# Service: Grafana
# =============================================================================
# Service để expose Grafana UI ra bên ngoài cluster qua NodePort.
#
# Truy cập:
#   - Grafana UI: http://localhost:30300
#   - Login: admin / admin (hoặc anonymous access enabled)
#
# NodePort 30300 cần được map khi tạo k3d cluster:
#   k3d cluster create devsharing -p "30300:30300@loadbalancer"
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devsharing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devsharing
spec:
  type: NodePort
  
  selector:
    app: grafana
  
  ports:
    - name: http
      protocol: TCP
      port: 3000        # Port của Service (internal)
      targetPort: 3000  # Port của container
      nodePort: 30300   # Port expose ra ngoài (external)
