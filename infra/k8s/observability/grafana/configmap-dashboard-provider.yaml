# =============================================================================
# ConfigMap: Grafana Dashboard Provider
# =============================================================================
# ConfigMap này chứa cấu hình dashboard provider cho Grafana.
# Dashboard provider cho phép Grafana tự động load dashboards từ ConfigMap.
#
# Dashboard provider sẽ:
#   - Tự động scan folder /var/lib/grafana/dashboards
#   - Load tất cả JSON dashboards trong folder
#   - Update dashboards khi ConfigMap thay đổi
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: devsharing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devsharing
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
      - name: 'Spring Boot Dashboards'
        orgId: 1
        folder: 'Spring Boot'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
