# =============================================================================
# Service: Prometheus
# =============================================================================
# Service để expose Prometheus UI ra bên ngoài cluster qua NodePort.
#
# Truy cập:
#   - Prometheus UI: http://localhost:30090
#   - Targets page: http://localhost:30090/targets
#   - Graph page: http://localhost:30090/graph
#
# NodePort 30090 cần được map khi tạo k3d cluster:
#   k3d cluster create devsharing -p "30090:30090@loadbalancer"
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: devsharing
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devsharing
spec:
  type: NodePort
  
  selector:
    app: prometheus
  
  ports:
    - name: http
      protocol: TCP
      port: 9090        # Port của Service (internal)
      targetPort: 9090  # Port của container
      nodePort: 30090   # Port expose ra ngoài (external)
