# =============================================================================
# ConfigMap: discovery-service (Eureka Server)
# =============================================================================
# Eureka là Service Discovery của Spring Cloud.
# Các microservice sẽ tự đăng ký vào Eureka khi khởi động,
# và tìm kiếm địa chỉ của nhau thông qua Eureka thay vì hardcode IP.
#
# Trong K8s, Eureka vẫn có thể dùng được nhưng thường được thay thế bởi
# cơ chế DNS nội bộ của K8s. Tuy nhiên, giữ lại Eureka giúp tương thích
# với code Spring Cloud hiện tại mà không cần refactor.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-service-config
  namespace: devsharing
  labels:
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/part-of: devsharing
data:
  # Tên service này trong hệ thống OTEL tracing
  OTEL_SERVICE_NAME: "discovery-service"
