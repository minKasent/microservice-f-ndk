spring:
  application:
    name: content-service
  profiles:
    active: local,swagger,loki
  config:
    import: "configserver:"
  cloud:
    config:
      uri: http://localhost:6969
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
server:
  port: 8003

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
